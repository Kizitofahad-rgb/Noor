<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142C21" />
      <stop offset="100%" stop-color="#0E1F17" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C0" />
      <stop offset="50%" stop-color="#E6C687" />
      <stop offset="100%" stop-color="#B89248" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" />

  <!-- Arabic Letter Nuun (ن) for Noor -->
  <!-- Upper Nuun Dot -->
  <circle cx="256" cy="180" r="28" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Nuun Bowl Semicircle -->
  <path d="M 148 240 C 148 335, 364 335, 364 240" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" filter="url(#goldGlow)" />
  
  <!-- Tiny Devotional Star Ornaments -->
  <path d="M 256 90 L 260 102 L 272 106 L 260 110 L 256 122 L 252 110 L 240 106 L 252 102 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 256 390 L 260 402 L 272 406 L 260 410 L 256 422 L 252 410 L 240 406 L 252 402 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 96 256 L 108 260 L 112 272 L 116 260 L 128 256 L 116 252 L 112 240 L 108 252 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 384 256 L 396 260 L 400 272 L 404 260 L 416 256 L 404 252 L 400 240 L 396 252 Z" fill="url(#goldGrad)" opacity="0.8" />
</svg>
